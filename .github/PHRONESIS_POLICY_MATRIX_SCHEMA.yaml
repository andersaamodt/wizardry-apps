version: 1
description: >
  Draft policy-matrix schema for the proposed phronesis standards repository.
  This is a seed artifact for deciding and enforcing Wizardry-family standards
  app-by-app instead of rediscovering variance in prose audits.

matrix_principles:
  - Treat unreasoned app-to-app variance as standards debt.
  - Every meaningful app difference must resolve to a policy status, approved exception, or pending decision.
  - The matrix records compliance evidence; it does not replace local audit reports.
  - Machine-readable status should point to human-readable evidence, not duplicate full findings.
  - Forge and future generators should be able to consume this matrix when planning new apps.

status_values:
  pass: Policy is implemented and current evidence proves it.
  fail: Policy is violated or required evidence is missing.
  exception-approved: Policy is intentionally not followed and the exception is approved with rationale.
  pending-decision: App behavior differs meaningfully and needs a standards decision before fix-it.
  not-applicable: Policy does not apply to this app or surface.
  unknown: Scope exists but has not been audited strongly enough.
  not-audited: Scope has not yet been checked.

severity_values:
  - low
  - medium
  - high

enforcement_layers:
  - docs
  - template
  - shared-host
  - backend-contract
  - generated-native
  - test-harness
  - release-tooling
  - manual-audit

policy_record_shape:
  required_fields:
    - id
    - title
    - group
    - default_status_for_new_apps
    - default_severity
    - enforcement_layer
    - source
  optional_fields:
    - rationale
    - canonical_doc
    - related_categories
    - allowed_exception_types
    - generator_default
    - validator_hint

app_record_shape:
  required_fields:
    - app
    - repo
    - audited_at
    - policies
  policy_status_fields:
    - policy_id
    - status
    - severity
    - evidence
    - categories
    - exception_id
    - pending_decision_id
    - next_action

policy_groups:
  variance:
    - id: variance.reasoned
      title: Meaningful variance is decisioned
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: docs
      source: .github/ROLLING_AUDIT_VARIANCE_LEDGER.yaml

  language:
    - id: language.shell-first
      title: Orchestration defaults to POSIX sh
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: template
      source: /Users/andersaamodt/.wizardry/.github/CODEX.md
    - id: language.exception-ledger
      title: Non-shell language boundaries are explicit
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: docs
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - python-exception-undocumented
        - language-exception-undocumented

  storage:
    - id: storage.app-home-default
      title: Primary durable app data defaults to home app-name root
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: template
      source: .github/ROLLING_AUDIT_PROPOSED_STANDARDS.md
      related_categories:
        - storage-default-home-missing
        - shared-xdg-app-namespace
    - id: storage.plain-text
      title: Durable app data is plain text by default
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: backend-contract
      source: .github/ROLLING_AUDIT_PROPOSED_STANDARDS.md
    - id: format.user-yaml-md
      title: User-facing editable files prefer YAML plus Markdown-oriented text
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: template
      source: .github/ROLLING_AUDIT_PROPOSED_STANDARDS.md

  tests:
    - id: tests.dot-tests
      title: Runnable test entrypoints live under .tests
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: test-harness
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - tests-not-under-dot-tests
    - id: tests.shipped-backend-contract
      title: Shipped apps have backend contract coverage
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: test-harness
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - backend-contract-tests-missing
    - id: tests.shipped-ui-contract
      title: Shipped GUI apps have UI or static contract coverage
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: test-harness
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - ui-static-tests-missing

  themes:
    - id: themes.shared-catalog-authority
      title: Apps using Wizardry themes discover the shared catalog
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: backend-contract
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - theme-catalog-hardcoded
    - id: themes.native-shared-catalog-parity
      title: Generated native targets use the discovered shared theme catalog
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: generated-native
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - generated-native-theme-catalog-hardcoded
    - id: themes.picker-keyboard
      title: Closed focused theme picker cycles with up and down arrows
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: test-harness
      source: .github/ROLLING_AUDIT_LEDGER.yaml
    - id: themes.list-alphabetized
      title: Theme lists are alphabetized at the authoritative source
      default_status_for_new_apps: pass
      default_severity: low
      enforcement_layer: backend-contract
      source: .github/ROLLING_AUDIT_LEDGER.yaml

  bridge:
    - id: bridge.no-shell-fragments
      title: Frontends never send shell fragments or sh -c payloads
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: shared-host
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - bridge-shell-fragment-execution
    - id: bridge.backend-resolution-owned
      title: Backend executable path resolution is host or backend owned
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: shared-host
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - frontend-derived-backend-path

  runtime:
    - id: runtime.no-cargo-on-demand
      title: Shipped runtime paths do not compile Cargo-managed helpers on demand
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: release-tooling
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - cargo-runtime-layer-present

  docs:
    - id: docs.local-exceptions
      title: Repo-local AI docs enumerate local exceptions
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: docs
      source: .github/ROLLING_AUDIT_LEDGER.yaml
      related_categories:
        - repo-ai-standards-missing
        - repo-local-exception-ledger-incomplete
    - id: docs.exception-ledger-shape
      title: Repo-local exception ledger follows the standard shape
      default_status_for_new_apps: pass
      default_severity: medium
      enforcement_layer: docs
      source: .github/PHRONESIS_EXTRACTION_PLAN.md

  repo_hygiene:
    - id: repo.no-disposable-cruft
      title: Source repos do not receive disposable build artifacts or app-instance state
      default_status_for_new_apps: pass
      default_severity: high
      enforcement_layer: release-tooling
      source: /Users/andersaamodt/git/phronesis/standards/repo-hygiene/wizardry-general.gitignore
      related_categories:
        - tracked-repo-cruft-placeholder
        - disposable-output-in-checkout

app_record_template:
  app: example-app
  repo: /Users/andersaamodt/git/example-app
  audited_at: YYYY-MM-DD
  policies:
    - policy_id: storage.app-home-default
      status: not-audited
      severity: high
      evidence: []
      categories: []
      exception_id: null
      pending_decision_id: null
      next_action: Audit durable storage root.
