<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Wizardry Desktop icon</title>
  <desc id="desc">A five-pointed yellow star on a royal blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d63ee"/>
      <stop offset="1" stop-color="#12339d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star-fill" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe97a"/>
      <stop offset="1" stop-color="#ffcb2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#071949" flood-opacity="0.34"/>
    </filter>
