  <rect x="80" y="80" width="864" height="864" rx="216" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="192" fill="url(#glow)"/>
  <path
    d="M512 192L593.1 400.4L816.3 413.1L643.2 554.6L700.1 770.9L512 650L323.9 770.9L380.8 554.6L207.7 413.1L430.9 400.4Z"
