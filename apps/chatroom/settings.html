<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatroom Settings</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1323;
      --panel: rgba(16, 24, 42, 0.92);
      --line: rgba(173, 190, 255, 0.2);
      --text: #edf3ff;
      --muted: #a8b6d6;
      --accent: #77a7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(119, 167, 255, 0.18), transparent 34%),
        linear-gradient(180deg, #0f1a31 0%, var(--bg) 100%);
    }

    .panel {
      width: min(100%, 640px);
      padding: 1.6rem;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    p {
      margin: 0.75rem 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.35rem;
    }

    a,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 0.95rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .primary {
      background: rgba(119, 167, 255, 0.18);
      border-color: rgba(119, 167, 255, 0.42);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Chatroom settings moved into the main app</h1>
    <p>The Chatroom app no longer uses a separate settings page. Open the main Chatroom surface and use the integrated settings rail on the right.</p>
    <div class="actions">
      <a class="primary" href="index.html#settings">Open Chatroom settings</a>
      <button id="redirect-now" type="button">Open now</button>
    </div>
  </main>
  <script>
    document.getElementById('redirect-now').addEventListener('click', () => {
      window.location.href = 'index.html#settings';
    });
    window.setTimeout(() => {
      window.location.replace('index.html#settings');
    }, 250);
  </script>
</body>
</html>
